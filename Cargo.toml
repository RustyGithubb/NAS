# NAS (nom provisoire) : console de pilotage du Mac mini (Windows) + agent installé sur le serveur (Linux).
[workspace]
resolver = "3"
members = ["crates/console", "crates/agent", "crates/proto", "crates/sync-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Adresse du dépôt : les releases (console et agent) y sont publiées par `dist`.
repository = "https://github.com/RustyGithubb/NAS"

[profile.release]
strip = true

# Profil des versions publiées (`dist`) : optimisations à l'édition de liens.
[profile.dist]
inherits = "release"
lto = "thin"
