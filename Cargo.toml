# NAS (nom provisoire) : console de pilotage du Mac mini (Windows) + agent installé sur le serveur (Linux).
[workspace]
resolver = "3"
members = ["crates/console", "crates/agent", "crates/proto", "crates/sync-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[profile.release]
strip = true
