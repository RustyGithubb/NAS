[package]
name = "nas-console"
description = "Console de pilotage du serveur (Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nas-proto = { path = "../proto" }
# Images des émojis (Twemoji, en PNG dans assets/emoji).
image = { version = "0.25", default-features = false, features = ["png"] }
# Heure locale des lignes de journal.
chrono = "0.4.45"
directories = "6.0.0"
# Suppression des fichiers de ce PC : vers la Corbeille de Windows, pas définitivement.
trash = "5"
eframe = { version = "0.37.0", features = ["glow"] }
# Clé d'accès de l'agent rangée dans le coffre de mots de passe du système (comme WorkTable).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Requêtes HTTP vers l'agent (sans moteur asynchrone).
ureq = { version = "2", default-features = false, features = ["json"] }
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
# Langue de Windows (choix « Langue du système »).
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }
# Fenêtres « Ouvrir » et « Choisir un dossier » de Windows (envoi, téléchargement).
rfd = "0.15"
