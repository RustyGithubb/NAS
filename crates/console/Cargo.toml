[package]
name = "nas-console"
description = "Console de pilotage du serveur (Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Release : console publiée pour Windows seulement (archive .zip).
[package.metadata.dist]
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
nas-proto = { path = "../proto" }
# Images des émojis (Twemoji, en PNG dans assets/emoji).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Heure locale des lignes de journal.
chrono = "0.4.45"
directories = "6.0.0"
# Suppression des fichiers de ce PC : vers la Corbeille de Windows, pas définitivement.
trash = "5"
eframe = { version = "0.37.0", features = ["glow"] }
# Clé d'accès de l'agent rangée dans le coffre de mots de passe du système (comme WorkTable).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Requêtes HTTP vers l'agent (sans moteur asynchrone) ; HTTPS (« tls ») pour les mises à jour
# publiées sur GitHub.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# Mises à jour : empreinte SHA-256 et archive .zip de la version publiée, remplacement de l'exe.
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
self-replace = "1.5.0"
urlencoding = "2.1.3"
# Images de profil des comptes de synchro, envoyées par l'agent en base64.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Instance unique : identifiant Windows de la fenêtre, pour la ramener au premier plan.
raw-window-handle = "0.6"
# Langue de Windows (choix « Langue du système »).
# Glisser vers l'Explorateur et le Bureau : glisser-déposer OLE (voir src/ole_drag.rs) ;
# nom des disques (src/drives.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Globalization",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
# Fenêtres « Ouvrir » et « Choisir un dossier » de Windows (envoi, téléchargement).
rfd = "0.15"

[build-dependencies]
# Icône du fichier .exe (Explorateur Windows), à partir de assets/logo.ico.
winresource = "0.1"
