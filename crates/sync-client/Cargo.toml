[package]
name = "nas-sync-client"
description = "Client de synchronisation avec le NAS, pour WorkTable et les apps suivantes (chiffrement de bout en bout)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nas-proto = { path = "../proto" }
# Chiffrement : clé dérivée du mot de passe (Argon2id), contenu en AES-256-GCM, noms en HMAC-SHA256.
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Même client HTTP que la console et WorkTable (sans moteur asynchrone).
ureq = { version = "2", features = ["json"] }
