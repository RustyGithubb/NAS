[package]
name = "nas-agent"
description = "Agent installé sur le serveur (Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nas-proto = { path = "../proto" }
# Clé d'accès tirée au hasard par le système.
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Mesures du système (processeur, mémoire, disques, températures), sous Linux comme sous Windows.
# Rester en 0.37 : l'API a changé ensuite.
sysinfo = "0.37"
# Serveur HTTP minimal, sans moteur asynchrone : léger pour le Mac mini.
tiny_http = "0.12"
# Synchronisation des apps : base SQLite (compilée avec l'agent, rien à installer), hachage des
# clés d'authentification, empreintes et contenu en base64.
rusqlite = { version = "0.42", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
# Décodage des paramètres d'URL (curseur de journal).
urlencoding = "2.1.3"

# Espace disque comme `df` (utilisé sans la réserve de l'administrateur) : appel système statvfs.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
